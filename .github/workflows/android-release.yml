name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Optional Android versionCode (defaults to github.run_number)'
        required: false
        default: ''
      track:
        description: 'Google Play track (internal, alpha, beta, production)'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies and verify
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --suppress-analytics --no-color
          flutter test --suppress-analytics --no-color

      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF
          chmod 600 android/key.properties

      - name: Build signed Android App Bundle
        run: |
          BUILD_NUM="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="${{ github.run_number }}"
          fi
          echo "BUILD_NUM=$BUILD_NUM" >> "$GITHUB_ENV"

          BUILD_NAME_ARG=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            TAG_VERSION="${TAG_VERSION%%+*}"
            BUILD_NAME_ARG="--build-name=$TAG_VERSION"
          fi

          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols/android \
            --build-number="$BUILD_NUM" \
            $BUILD_NAME_ARG

      - name: Upload AAB and debug symbols artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ env.BUILD_NUM }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symbols/android

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aungmyokyaw.dhammaecho
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed

      - name: Clean up credentials
        if: always()
        run: |
          rm -f "$KEYSTORE_PATH" android/key.properties
