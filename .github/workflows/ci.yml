name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.9
  PYTHON_VERSION: "3.13"

jobs:
  quality-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-tooling.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-tooling.txt
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate mobile platform folders
        run: make bootstrap
      - name: Verify bundled production catalogue
        run: make verify-catalogue
      - name: Resolve Dart dependencies
        run: make deps
      - name: Repository contract
        run: make repository-check
      - name: Format
        run: make format-check
      - name: Analyze
        run: make lint
      - name: Reject disabled tests
        run: make check-tests
      - name: Test and coverage
        run: make coverage
      - name: Build Android release
        run: make build-android

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-tooling.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-tooling.txt
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate mobile platform folders
        run: make bootstrap
      - name: Verify bundled production catalogue
        run: make verify-catalogue
      - name: Resolve Dart dependencies
        run: make deps
      - name: Build iOS without signing
        run: make build-ios
